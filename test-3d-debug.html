<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Viewer Debug</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #debug { position: fixed; top: 10px; left: 10px; background: white; padding: 10px; border: 1px solid black; z-index: 999; max-width: 300px; max-height: 200px; overflow-y: auto; }
    #viewer { width: 100vw; height: 100vh; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="debug">
    <h3>Debug Info</h3>
    <p>Loading...</p>
  </div>
  <div id="viewer" data-three-viewer data-model-path="data/models/ct-scanner.glb" data-fallback-model="ct-scanner">
    <div class="imaging-3d-viewer"></div>
  </div>

  <script type="module">
    const debugEl = document.querySelector('#debug');
    const logs = [];

    function addLog(msg) {
      logs.push(msg);
      debugEl.innerHTML = `<h3>Debug</h3><p>${logs.join('<br>')}</p>`;
    }

    try {
      addLog('Module loaded');

      import('js/topic-3d-viewer.js').then(() => {
        addLog('topic-3d-viewer loaded successfully');
      }).catch(err => {
        addLog('Error loading topic-3d-viewer: ' + err.message);
      });

      addLog('Waiting for THREE...');
      import('three').then((THREE) => {
        addLog('THREE loaded: ' + THREE.version);
      }).catch(err => {
        addLog('Error loading THREE: ' + err.message);
      });

    } catch (err) {
      addLog('Error: ' + err.message);
    }
  </script>
</body>
</html>
